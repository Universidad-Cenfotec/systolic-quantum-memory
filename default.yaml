# ============================================================================
# SQM Research - Default Configuration File
# ============================================================================
# This file defines all experiment configurations, workloads, and parameters
# Can be overridden by CLI arguments when running main.py

# ============================================================================
# Global Settings
# ============================================================================
global:
  backend: hardware            # Options: simulator, hardware
  seed: 42                            # Random seed (null = random)

# ============================================================================
# Simulator Configuration
# ============================================================================
simulator: 
  # Compiler parameters
  compiler:
    R: 1                                # Memory registers
    n: 1                                # Qubits per register
    c_max: 10                         # Gate cost threshold
    t_max_ns: 55000                  # Time threshold (nanoseconds)
    
  # Simulation parameters
  execution: 
    shots: 1024                          # Number of shots
    initial_state: 1                    # 0=|0>, 1=|1>, 2=|+>, 3=|->
    workload_type: delay             # Options: standard, delay, custom
    scenarios: "1,3"                      # null = all, or "1,3" for specific scenarios
    pauli_twirling: False               # Enable randomized compiling on SQM teleportation
    twirling_variants: 5               # Random circuits per workload
    twirling_seed: 42                 # Integer for reproducible variants
  
  # Thermal parameters (quantum noise model)
  thermal:
    use_default: True                   # Use default IBM values
    T1_ns: 149149                       # T1 relaxation time (nanoseconds)
    T2_ns: 38194                        # T2 dephasing time (nanoseconds)
    idle_time_ns: 30000                  # Idle period duration (nanoseconds)

# ============================================================================
# Hardware Configuration
# ============================================================================
hardware:
  # IBM Quantum connection
  backend_name: ibm_kingston            # IBM backend to use
  channel: ibm_quantum_platform                  # Channel: ibm_quantum or ibm_cloud
  # Compiler parameters (same as simulator)
  compiler:
    R: 1 
    n: 1
    c_max: 10 
    t_max_ns:  30000 
  
  # Execution parameters 
  execution:
    shots: 1024                         # Hardware shots (lower than simulator)
    initial_state: 1                   # 0=|0>, 1=|1>, 2=|+>, 3=|->
    workload_type: delay             # Options: standard, , custom
    scenarios: "1,3"                     # null = all, or "1,3" for specific scenarios
    pauli_twirling: False               # Enable randomized compiling on SQM teleportation
    twirling_variants: 10               # Random circuits/jobs per workload
    twirling_seed: 42                 # Integer for reproducible variants

# ============================================================================
# Workload Definitions
# ============================================================================
workloads:
  standard:
    description: Read-Write patterns with configurable multiplier
    count: 10                            # Number of workloads to generate
    multiplier: 10                       # Increment multiplier
    # Auto-generated: Each workload i has READ_0 (i*multiplier times) + WRITE_0 + READ_0 (i*multiplier times) + READ_0
  
  delay: 
    description: IDLE delay sweep
    delays_ns: [10, 20, 40, 80, 100, 150, 200, 300, 400, 500]
    #delays_ns: [80]
    # Auto-generated: WRITE_0 + IDLE_X + READ_0 for each delay X
    
  custom: 
    description: Custom workload definitions
    workloads:
      - name: "Test Workload 1"
        instructions: ["READ_0", "WRITE_0", "READ_0"]
      
      - name: "Test Workload 2"
        instructions: ["WRITE_0", "READ_0", "WRITE_0", "READ_0"]

# ============================================================================
# Output Configuration
# ============================================================================
output:
  results_dir: results/                 # Where to save results
  save_csv: true                        # Save comparison results to CSV
  save_plots: true                      # Generate comparison plots
  plot_format: png                      # Format: png, pdf, svg
  verbose: true                         # Print detailed output

# ============================================================================
# Advanced Options
# ============================================================================
advanced:
  parallel_workloads: false             # Parallelize workload execution
  timeout_seconds: 3600                 # Timeout for long-running experiments
  cache_results: false                  # Cache intermediate results

# ============================================================================
# Error Mitigation Configuration
# ============================================================================
# ZNE and REM are applied as post-processing layers. They do NOT modify
# the SQM/SWAP circuit construction, teleportation protocol, or mid-circuit
# measurements. REM only corrects the final measurement register (final_meas).
# ZNE folds only top-level unitary gates, never measure/reset/if_test/delay.
mitigation:
  enabled: False
  target_architecture: sqm            # Options: both, sqm, swap
  hardware:
    max_shots_per_execution: 1024
  zne:
    enabled: False                      # Enable Zero Noise Extrapolation
    noise_factors: [1,3,5]               # Noise amplification factors (positive odd integers)
    extrapolator: exponential                # Extrapolation method: linear, polynomial, exponential
    zne_seed: null                      # Seed for ZNE reproducibility (null = use global seed)
  rem: 
    enabled: False                      # Enable Readout Error Mitigation
